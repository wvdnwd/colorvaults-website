name: Pinterest Auto Poster Bot

on:
  schedule:
    # Runs 4 times a day: 08:00, 12:00, 16:00, and 20:00 UTC (10:00, 14:00, 18:00, 22:00 CEST)
    - cron: '0 8,12,16,20 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  post-to-pinterest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Pinterest Auto Poster
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_DEFAULT_BOARD_ID: ${{ secrets.PINTEREST_DEFAULT_BOARD_ID }}
          POST_LANG: 'both'
        run: |
          python scripts/pinterest_auto_poster.py

      - name: Commit & Push Pin History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/posted_pins.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(bot): update posted Pinterest pins history [skip ci]"
            git push
          fi
